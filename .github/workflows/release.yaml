name: Build and Release KOReader Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify tag points to the main branch tip
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Release tags must point to the current main branch tip"
            exit 1
          }

      - name: Prepare plugin folder
        run: |
          mkdir linefocus.koplugin
          shopt -s extglob
          cp -r !(linefocus.koplugin|.git|.github|koreader) linefocus.koplugin/

      - name: Create zip archive
        run: |
          zip -r linefocus.koplugin.zip linefocus.koplugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: linefocus.koplugin.zip
